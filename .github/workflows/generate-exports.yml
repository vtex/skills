name: Generate Skill Exports

on:
  push:
    branches: [main]
    paths:
      - 'tracks/**'
      - 'scripts/**/*.ts'
      - '_templates/**'
      - 'package.json'
  pull_request:
    paths:
      - 'tracks/**'
      - 'scripts/**/*.ts'
      - '_templates/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate skills
        run: bun run validate

      - name: Generate exports
        run: bun run export

      - name: Sync plugin directories
        run: |
          rm -f rules/*.mdc
          cp exports/cursor/*.mdc rules/
          rm -rf skills/
          cp -r exports/opencode/. skills/

      - name: Check exports are up to date
        run: |
          if ! git diff --quiet exports/ rules/ skills/; then
            echo ""
            echo "❌ Exports are out of date. Run 'bun run export' locally and commit the result."
            echo ""
            git diff --stat exports/ rules/ skills/
            exit 1
          fi
          echo "✅ Exports are up to date."
